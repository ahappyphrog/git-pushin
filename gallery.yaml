desc: >
  Our project is an calendar app. The system that we are building is a calendar 
  system that allows you to schedule events yourself and other people as well as 
  accept invites from other people to join their events. The app keeps everyone
  on the same page by surfacing scheduling conflicts, offering reminders, and
  letting users share calendars across teams or families. We also plan to
  integrate Cornell-specific resources like course schedules and club meetings
  so that students can manage campus life without juggling multiple tools.
  
